<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 840" width="600" height="840">
  <rect width="600" height="840" fill="#FFFFFF"/>
  <rect x="28" y="28" width="544" height="784" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>

  <!-- Section Banner -->
  <rect x="52" y="54" width="496" height="22" fill="#1E3A5F"/>
  <text x="300" y="69" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="10.5" fill="#FFFFFF">TOMO II • SECCIÓN 2</text>
  <rect x="52" y="76" width="496" height="24" fill="#B45309"/>
  <text x="300" y="92" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="11.5" fill="#FFFFFF">CLASIFICACIÓN Y NATURALEZA DE CUENTAS CONTABLES</text>

  <text x="300" y="130" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="14" fill="#1E3A5F">CUADERNO DE TRABAJO PRÁCTICO (ENSAYO)</text>
  <text x="52" y="152" font-family="sans-serif" font-size="9.5" fill="#374151">100 cuentas contables representativas de la actividad comercial y financiera en Paraguay.</text>

  <!-- Guide Box -->
  <rect x="52" y="166" width="496" height="76" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="0.8"/>
  <text x="62" y="182" font-family="sans-serif" font-weight="bold" font-size="9.5" fill="#1E3A5F">GUÍA DE RESOLUCIÓN PARA EL ESTUDIANTE</text>
  <text x="62" y="197" font-family="sans-serif" font-size="8.8" fill="#1F2937">1. Tipo de Cuenta: Activo (A), Pasivo (P), Patrimonio Neto (PN), Ingreso (I) o Egreso (E).</text>
  <text x="62" y="211" font-family="sans-serif" font-size="8.8" fill="#1F2937">2. Tipo de Elemento: Cuenta Patrimonial (P) o de Resultado (R).</text>
  <text x="62" y="225" font-family="sans-serif" font-size="8.8" fill="#1F2937">3. Naturaleza del Saldo: Deudora (D) o Acreedora (Ac) • 4. Debe (+) / Haber (-).</text>

  <text x="52" y="266" font-family="sans-serif" font-weight="bold" font-size="13" fill="#1E3A5F">Sección I: Matriz Práctica de Clasificación de 100 Cuentas</text>

  <!-- Matrix Table Header -->
  <rect x="52" y="280" width="496" height="24" fill="#1E3A5F"/>
  <text x="68" y="296" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="9.5" fill="#FFFFFF">N°</text>
  <text x="158" y="296" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="9.5" fill="#FFFFFF">Nombre de la Cuenta</text>
  <text x="275" y="296" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="9.5" fill="#FFFFFF">Tipo</text>
  <text x="330" y="296" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="9.5" fill="#FFFFFF">Elemento</text>
  <text x="396" y="296" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="9.5" fill="#FFFFFF">Naturaleza</text>
  <text x="462" y="296" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="9.5" fill="#FFFFFF">DEBE</text>
  <text x="518" y="296" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="9.5" fill="#FFFFFF">HABER</text>

  <!-- Rows -->
  <g font-family="sans-serif" font-size="9.5" fill="#1F2937">
    <rect x="52" y="304" width="496" height="24" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="0.6"/>
    <text x="68" y="320" text-anchor="middle">1</text><text x="92" y="320">Caja</text><text x="275" y="320" text-anchor="middle" font-weight="bold">A</text><text x="330" y="320" text-anchor="middle">P</text><text x="396" y="320" text-anchor="middle">D</text><text x="462" y="320" text-anchor="middle" font-weight="bold">+</text><text x="518" y="320" text-anchor="middle">-</text>

    <rect x="52" y="328" width="496" height="24" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="0.6"/>
    <text x="68" y="344" text-anchor="middle">2</text><text x="92" y="344">Documentos a Cobrar</text><text x="275" y="344" text-anchor="middle" font-weight="bold">A</text><text x="330" y="344" text-anchor="middle">P</text><text x="396" y="344" text-anchor="middle">D</text><text x="462" y="344" text-anchor="middle" font-weight="bold">+</text><text x="518" y="344" text-anchor="middle">-</text>

    <rect x="52" y="352" width="496" height="24" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="0.6"/>
    <text x="68" y="368" text-anchor="middle">3</text><text x="92" y="368">IVA a pagar</text><text x="275" y="368" text-anchor="middle" font-weight="bold">P</text><text x="330" y="368" text-anchor="middle">P</text><text x="396" y="368" text-anchor="middle">Ac</text><text x="462" y="368" text-anchor="middle">-</text><text x="518" y="368" text-anchor="middle" font-weight="bold">+</text>

    <rect x="52" y="376" width="496" height="24" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="0.6"/>
    <text x="68" y="392" text-anchor="middle">4</text><text x="92" y="392">Capital</text>
    <rect x="52" y="400" width="496" height="24" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="0.6"/>
    <text x="68" y="416" text-anchor="middle">5</text><text x="92" y="416">Reserva Legal</text>
    <rect x="52" y="424" width="496" height="24" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="0.6"/>
    <text x="68" y="440" text-anchor="middle">6</text><text x="92" y="440">Proveedores</text>
    <rect x="52" y="448" width="496" height="24" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="0.6"/>
    <text x="68" y="464" text-anchor="middle">7</text><text x="92" y="464">Clientes</text>
    <rect x="52" y="472" width="496" height="24" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="0.6"/>
    <text x="68" y="488" text-anchor="middle">8</text><text x="92" y="488">Rodados</text>
    <rect x="52" y="496" width="496" height="24" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="0.6"/>
    <text x="68" y="512" text-anchor="middle">9</text><text x="92" y="512">Banco XX</text>
    <rect x="52" y="520" width="496" height="24" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="0.6"/>
    <text x="68" y="536" text-anchor="middle">10</text><text x="92" y="536">Caja Chica</text>
    <rect x="52" y="544" width="496" height="24" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="0.6"/>
    <text x="68" y="560" text-anchor="middle">11</text><text x="92" y="560">Sueldos a Pagar</text>
    <rect x="52" y="568" width="496" height="24" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="0.6"/>
    <text x="68" y="584" text-anchor="middle">12</text><text x="92" y="584">Acreedores</text>
    <rect x="52" y="592" width="496" height="24" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="0.6"/>
    <text x="68" y="608" text-anchor="middle">13</text><text x="92" y="608">Inmuebles</text>
    <rect x="52" y="616" width="496" height="24" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="0.6"/>
    <text x="68" y="632" text-anchor="middle">51</text><text x="92" y="632">IVA Crédito</text>
    <rect x="52" y="640" width="496" height="24" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="0.6"/>
    <text x="68" y="656" text-anchor="middle">52</text><text x="92" y="656">IVA Débito</text>
    <rect x="52" y="664" width="496" height="24" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="0.6"/>
    <text x="68" y="680" text-anchor="middle">100</text><text x="92" y="680">Gastos No deducibles</text>
  </g>

  <!-- Vertical column grid lines -->
  <line x1="84" y1="280" x2="84" y2="688" stroke="#D1D5DB" stroke-width="0.8"/>
  <line x1="250" y1="280" x2="250" y2="688" stroke="#D1D5DB" stroke-width="0.8"/>
  <line x1="300" y1="280" x2="300" y2="688" stroke="#D1D5DB" stroke-width="0.8"/>
  <line x1="360" y1="280" x2="360" y2="688" stroke="#D1D5DB" stroke-width="0.8"/>
  <line x1="432" y1="280" x2="432" y2="688" stroke="#D1D5DB" stroke-width="0.8"/>
  <line x1="490" y1="280" x2="490" y2="688" stroke="#D1D5DB" stroke-width="0.8"/>

  <!-- Callout Box for Solucionario -->
  <rect x="52" y="704" width="496" height="58" rx="6" fill="#E8DCC4" stroke="#1E3A5F" stroke-width="1"/>
  <text x="68" y="726" font-family="sans-serif" font-weight="bold" font-size="11" fill="#1E3A5F">Incluye Solucionario Oficial Completo + Casos Especiales</text>
  <text x="68" y="745" font-family="sans-serif" font-size="9.5" fill="#2C2C2C">Sección 3 resuelve las 100 cuentas paso a paso + 4 casos de razonamiento.</text>

  <text x="300" y="795" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#4B5563">Estudio Cáceres • Tomo II Digital (PDF) • Página 6</text>
</svg>
